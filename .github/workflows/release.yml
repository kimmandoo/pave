name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: aarch64
          - runner: macos-26
            os: darwin
            arch: arm64
          - runner: macos-26-intel
            os: darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 'ocaml-variants.5.5.1+options,ocaml-option-no-compression'
      - name: Install dependencies
        run: opam install . --deps-only --with-test -y
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          opam exec -- dune runtest --force -j 1 2>&1 | tee test-results.log
      - name: Preserve failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: test-results.log
          if-no-files-found: error
      - name: Build native executable
        env:
          PAVE_RELEASE_VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$ARCH" = "arm64" ]; then
            opam exec -- dune build --profile release bin/main.exe bin/pave-apple-foundation-models
          else
            opam exec -- dune build --profile release bin/main.exe
          fi
      - name: Package release archive
        env:
          ASSET: pave-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          mkdir -p bundle
          cp _build/default/bin/main.exe bundle/pave
          if [ "$OS" = "darwin" ] && [ "$ARCH" = "arm64" ]; then
            chmod u+w bundle/pave
            helper=_build/default/bin/pave-apple-foundation-models
            test -x "$helper"
            "$helper" --help >/dev/null
            helper_size="$(wc -c < "$helper" | tr -d '[:space:]')"
            cat "$helper" >> bundle/pave
            printf '%016x%s' "$helper_size" PAVEAFM1 >> bundle/pave
            chmod u-w bundle/pave
          fi
          cp LICENSE THIRD_PARTY_NOTICES bundle/
          tar -czf "$ASSET" -C bundle pave LICENSE THIRD_PARTY_NOTICES
      - name: Smoke packaged native executable
        env:
          ASSET: pave-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          {
            set -eu
            unpacked="$(mktemp -d)"
            trap 'rm -rf "$unpacked"' EXIT
            archive_members="$(tar -tzf "$ASSET")"
            expected_members="$(printf 'pave\nLICENSE\nTHIRD_PARTY_NOTICES')"
            if [ "$archive_members" != "$expected_members" ]; then
              echo "release archive member set changed unexpectedly: $archive_members" >&2
              exit 1
            fi
            tar -xzf "$ASSET" -C "$unpacked"
            test -x "$unpacked/pave"
            if [ "$OS" = "darwin" ] && [ "$ARCH" = "arm64" ]; then
              sh test/distribution/check_release_dependencies.sh "$OS" "$unpacked/pave" _build/default/bin/pave-apple-foundation-models
            else
              sh test/distribution/check_release_dependencies.sh "$OS" "$unpacked/pave"
            fi
            "$unpacked/pave" --help >/dev/null
            providers="$("$unpacked/pave" --providers)"
            case "$providers" in
              *ollama*) ;;
              *) echo "packaged binary did not list the Ollama provider" >&2; exit 1 ;;
            esac
            if [ "$OS" = "darwin" ] && [ "$ARCH" = "arm64" ]; then
              case "$providers" in
                *apple*) ;;
                *) echo "packaged Apple-silicon binary did not list Apple Foundation Models" >&2; exit 1 ;;
              esac
              set +e
              apple_output="$("$unpacked/pave" --provider apple --model default --prompt "Reply with OK." 2>&1)"
              apple_status=$?
              set -e
              if [ "$apple_status" -ne 0 ]; then
                case "$apple_output" in
                  *"Apple Intelligence is disabled"*|*"Apple Foundation Models is unavailable"*|*"Apple Foundation Models requires"*|*"model is not ready"*|*"Apple Intelligence-eligible Apple-silicon Mac"*) ;;
                  *) echo "packaged Apple route failed without an availability diagnostic: $apple_output" >&2; exit 1 ;;
                esac
              fi
            elif [ "$OS" = "darwin" ] && [ "$ARCH" = "x86_64" ]; then
              case "$providers" in
                *apple*) echo "macOS Intel archive unexpectedly listed Apple Foundation Models" >&2; exit 1 ;;
                *) ;;
              esac
            fi
          } 2>&1 | tee package-smoke.log
      - name: Exercise disposable installed updater transactions
        env:
          PAVE_RELEASE_VERSION: v0.0.1
          PAVE_TEST_RELEASE_BASE_URL: https://127.0.0.1:18443
        run: |
          set -o pipefail
          opam exec -- dune build --profile release bin/main.exe 2>&1 | tee updater-transaction.log
          python3 test/distribution/installed_update.py _build/default/bin/main.exe install.sh 2>&1 | tee -a updater-transaction.log
      - name: Expose native smoke failure diagnostics
        if: failure()
        run: |
          for log in package-smoke.log updater-transaction.log; do
            if [ -f "$log" ]; then
              {
                echo "### Native smoke output ($log)"
                echo '```text'
                tail -n 100 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Preserve native smoke failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            package-smoke.log
            updater-transaction.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pave-${{ matrix.os }}-${{ matrix.arch }}
          path: pave-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pave-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          sha256sum \
            pave-darwin-arm64.tar.gz \
            pave-darwin-x86_64.tar.gz \
            pave-linux-aarch64.tar.gz \
            pave-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo "refusing to replace assets on an already published release" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            pave-darwin-arm64.tar.gz \
            pave-darwin-x86_64.tar.gz \
            pave-linux-aarch64.tar.gz \
            pave-linux-x86_64.tar.gz \
            SHA256SUMS
          uploaded="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' SHA256SUMS pave-darwin-arm64.tar.gz pave-darwin-x86_64.tar.gz pave-linux-aarch64.tar.gz pave-linux-x86_64.tar.gz | sort)"
          if [ "$uploaded" != "$expected" ]; then
            echo "release asset set incomplete; leaving release as draft" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
