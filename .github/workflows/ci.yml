name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: OCaml ${{ matrix.ocaml }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        ocaml: ['5.3.0', '5.5.1']
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - name: Install dependencies
        run: opam install . --deps-only --with-test -y
      - name: Check opam package
        run: opam lint pave.opam
      - name: Run tests
        run: opam exec -- dune runtest --force
      - name: Build installation artifacts
        run: opam exec -- dune build @install
      - name: Smoke CLI help
        run: opam exec -- dune exec pave -- --help
