name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: OCaml ${{ matrix.ocaml }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        ocaml: ['5.3.0', '5.5.1']
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - name: Install dependencies
        run: opam install . --deps-only --with-test -y
      - name: Check opam package
        if: matrix.os == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        run: opam lint pave.opam
      - name: Run tests
        run: opam exec -- dune runtest --force -j 1
      - name: Build installation artifacts
        run: opam exec -- dune build @install
      - name: Smoke CLI help
        run: opam exec -- dune exec pave -- --help
      - name: Smoke Apple Foundation Models helper
        if: runner.os == 'macOS'
        run: |
          _build/default/bin/pave-apple-foundation-models --help
          providers="$(opam exec -- dune exec pave -- --providers)"
          case "$providers" in
            *apple*) ;;
            *) echo "macOS arm64 binary did not list Apple Foundation Models" >&2; exit 1 ;;
          esac
      - name: Provision Gradle for disposable mobile acceptance
        if: matrix.os == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Check real focused Gradle variant
        if: matrix.os == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        env:
          PAVE_REAL_MOBILE_STACK: gradle
        run: opam exec -- dune exec test/test_mobile_real.exe
      - name: Provision Flutter for disposable mobile acceptance
        if: matrix.os == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check real Flutter analysis
        if: matrix.os == 'ubuntu-24.04' && matrix.ocaml == '5.5.1'
        env:
          PAVE_REAL_MOBILE_STACK: flutter
        run: opam exec -- dune exec test/test_mobile_real.exe
      - name: Check real focused SwiftPM test
        if: runner.os == 'macOS' && matrix.ocaml == '5.5.1'
        env:
          PAVE_REAL_MOBILE_STACK: swiftpm
        run: opam exec -- dune exec test/test_mobile_real.exe
